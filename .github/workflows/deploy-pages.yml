name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/extension/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/build-pages.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'gh-pages-deploy'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension distribution bundle
        run: |
          pnpm --filter @pathixo/extension build
          pnpm --filter @pathixo/extension zip

      - name: Build static Next.js landing page export
        run: node scripts/build-pages.mjs

      - name: Deploy static export to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web/out
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
