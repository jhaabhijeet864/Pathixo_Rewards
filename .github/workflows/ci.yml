name: CI Status Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck & Build Status Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck all workspaces
        run: pnpm -r typecheck

      - name: Build WXT Manifest V3 Extension
        run: pnpm --filter @pathixo/extension build

      - name: Zip Extension for Chrome Web Store
        run: pnpm --filter @pathixo/extension zip

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pathixo-rewards-extension
          path: apps/extension/.output/pathixo-rewards-extension.zip
          retention-days: 14

      - name: Build Web Platform (Next.js 15)
        run: pnpm --filter @pathixo/web build
